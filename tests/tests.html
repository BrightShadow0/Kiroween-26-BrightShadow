<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specter Engine — Test Suite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14; --panel: #141720; --card: #1b1f2e;
      --accent: #c8a84b; --success: #27ae60; --danger: #c0392b;
      --text: #d4d8e8; --muted: #7a7f99; --dim: #4a4f66;
      --border: #2a2f45;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Trebuchet MS', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 2rem;
    }

    h1 {
      color: var(--accent);
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .subtitle { color: var(--muted); margin-bottom: 2rem; }

    #summary {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .all-pass { border-color: #27ae60; color: #5dbe7e; }
    .some-fail { border-color: #c0392b; color: #e57a72; }

    .group-block {
      margin-bottom: 1.5rem;
    }

    .group-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
    }

    .test-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 2px;
    }

    .test-row.pass { background: rgba(39,174,96,0.06); }
    .test-row.fail { background: rgba(192,57,43,0.1); }

    .test-icon { font-size: 0.85rem; min-width: 1.2em; }
    .test-name { flex: 1; color: var(--text); }
    .test-error { color: #e57a72; font-size: 0.8rem; margin-top: 0.1rem; font-family: monospace; }

    a.back {
      display: inline-block;
      margin-top: 2rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    a.back:hover { color: var(--accent); }
  </style>
</head>
<body>
  <h1>👁️ Specter Engine — Test Suite</h1>
  <p class="subtitle">Schema validation · Separation · Engine logic · Game walkthroughs</p>
  <div id="summary">Running tests…</div>
  <div id="results"></div>
  <a class="back" href="../index.html">← Back to games</a>

  <!-- Load game data as global variables for the test suite -->
  <script>
    // Fetch game JSON files and then run tests
    Promise.all([
      fetch('../games/forgotten-temple.json').then(r => r.json()),
      fetch('../games/case-zero.json').then(r => r.json())
    ]).then(function ([temple, caseZero]) {
      window._templeData = temple;
      window._caseData   = caseZero;
      // Now load engine dependencies
      return Promise.all([
        loadScript('../engine/schema.js'),
        loadScript('../engine/engine.js')
      ]);
    }).then(function () {
      // Run tests
      return loadScript('tests.js');
    }).then(function () {
      renderResults();
    }).catch(function (err) {
      document.getElementById('summary').textContent = '⚠️ Error: ' + err.message;
      document.getElementById('summary').className = 'some-fail';
    });

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = src;
        s.onload  = resolve;
        s.onerror = function () { reject(new Error('Failed to load ' + src)); };
        document.body.appendChild(s);
      });
    }

    function renderResults() {
      const results = window._specterTestResults || [];
      const passed  = results.filter(r => r.passed).length;
      const failed  = results.filter(r => !r.passed).length;
      const total   = results.length;

      const summaryEl = document.getElementById('summary');
      if (failed === 0) {
        summaryEl.textContent = '✓ All ' + total + ' tests passed.';
        summaryEl.className = 'all-pass';
      } else {
        summaryEl.textContent = '✗ ' + failed + ' of ' + total + ' tests failed.';
        summaryEl.className = 'some-fail';
      }

      // Group results
      const groups = {};
      for (const r of results) {
        if (!groups[r.group]) groups[r.group] = [];
        groups[r.group].push(r);
      }

      const container = document.getElementById('results');
      for (const [groupName, tests] of Object.entries(groups)) {
        const block = document.createElement('div');
        block.className = 'group-block';
        const groupLabel = document.createElement('div');
        groupLabel.className = 'group-name';
        groupLabel.textContent = groupName;
        block.appendChild(groupLabel);

        for (const t of tests) {
          const row = document.createElement('div');
          row.className = 'test-row ' + (t.passed ? 'pass' : 'fail');
          row.innerHTML = `
            <span class="test-icon">${t.passed ? '✓' : '✗'}</span>
            <div>
              <div class="test-name">${t.name}</div>
              ${t.error ? '<div class="test-error">' + t.error + '</div>' : ''}
            </div>
          `;
          block.appendChild(row);
        }
        container.appendChild(block);
      }
    }
  </script>
</body>
</html>
